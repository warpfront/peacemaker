# SPDX-License-Identifier: Apache-2.0
# Generated by scripts/mirror-split.sh in the canonical hipfire repository for the PeaceMaker
# mirror: the inherited workspace package keys and only the workspace dependencies
# the crates below actually use. Edit https://github.com/warpfront/hipfire instead.
[workspace]
resolver = "2"
members = [
    "crates/peacemaker-author",
    "crates/peacemaker-ir",
    "crates/peacemaker-isa",
    "crates/peacemaker-lift",
    "crates/peacemaker-npu",
    "crates/peacemaker-rip",
    "crates/radiowave",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
